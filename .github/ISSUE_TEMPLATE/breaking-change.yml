name: Breaking Change Request
description: Suggest a breaking change that requires a major version bump
title: 'Breaking Change: '
labels: [major]
assignees:
  - donavanbecker
body:
  - type: markdown
    attributes:
      value: |
        You must use the issue template below when submitting a breaking change request.
        
        **Note**: Breaking change requests are automatically labeled as `major` for semantic versioning. This indicates the change will increment the major version (e.g., 2.0.2 → 3.0.0).
  - type: markdown
    attributes:
      value: |
        Is your breaking change request related to a problem? Please describe.
  - type: textarea
    attributes:
      label: Problem
      placeholder: A clear and concise description of what the problem is. Ex. The current API is confusing when [...]
    validations:
      required: false
  - type: textarea
    attributes:
      label: Breaking Change Description
      placeholder: A clear and concise description of what breaking change you want to implement and why it's necessary.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Migration Path
      placeholder: Describe how users can migrate from the current version to the new breaking change. What steps do they need to take?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      placeholder: A clear and concise description of any alternative solutions that wouldn't require breaking changes.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      placeholder: Add any other context or screenshots about the breaking change request here.
    validations:
      required: false