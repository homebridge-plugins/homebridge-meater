name: Feature Request
description: Suggest an idea for this project
title: 'Feature Request: '
labels: [minor]
assignees:
  - donavanbecker
body:
  - type: markdown
    attributes:
      value: |
        You must use the issue template below when submitting a feature request.
        
        **Note**: Feature requests are automatically labeled as `minor` for semantic versioning. This indicates the feature will increment the minor version (e.g., 2.0.2 → 2.1.0). If your feature request involves breaking changes, please mention it in the description so the label can be changed to `major`.
  - type: markdown
    attributes:
      value: |
        Is your feature request related to a problem? Please describe.
  - type: textarea
    attributes:
      label: Problem
      placeholder: A clear and concise description of what the problem is. Ex. I am always frustrated when [...]
    validations:
      required: false
  - type: textarea
    attributes:
      label: Solution
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      placeholder: A clear and concise description of any alternative solutions or features you have considered.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      placeholder: Add any other context or screenshots about the feature request here. Post device logs here.
    validations:
      required: false
